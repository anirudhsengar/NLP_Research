[project]
name = "ai-text-detector-research"
version = "0.1.0"
description = "Interpretable and bias-aware detection of AI-generated text for the CSAI411 NLP project."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "datasets>=3.0.0",
  "gradio>=4.44.0",
  "huggingface-hub>=0.25.0",
  "joblib>=1.4.2",
  "matplotlib>=3.8.0",
  "numpy>=1.26.0",
  "openpyxl>=3.1.5",
  "pandas>=2.2.0",
  "pyyaml>=6.0.2",
  "rich>=13.7.0",
  "scikit-learn>=1.5.0",
  "scipy>=1.13.0",
  "seaborn>=0.13.2",
  "tqdm>=4.66.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
baselines = [
  "accelerate>=0.33.0",
  "torch>=2.4.0",
  "transformers>=4.44.0",
]
spacy = [
  "spacy>=3.7.0",
]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.6.0",
]

[project.scripts]
aidetect = "ai_text_detector.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_text_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["ai_text_detector_final"]
